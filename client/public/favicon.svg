<?xml version="1.0" encoding="UTF-8"?>
<!--
  NightRiver — icon-only favicon (SVG, served at /favicon.svg).
  Modern browsers honor <link rel="icon" type="image/svg+xml"> at any size;
  favicon.ico (16/32/48, PNG-compressed entries) covers the rest.

  Same mark as the bot / Crypto Pay avatar: cyan crescent cradling an amber
  spade over a river sweep. The avatar version adds a faint circular rim —
  it exists to give a round crop an edge, so it is left out here, where the
  shape is a rounded square.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="NightRiver">
  <defs>
    <radialGradient id="nr-bg" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#16161f"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </radialGradient>
    <filter id="nr-glow-cyan" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nr-glow-amber" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="nr-river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0.08"/>
      <stop offset="46%"  stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.08"/>
    </linearGradient>
    <!-- crescent = disc minus an offset disc; the bite holds the spade -->
    <mask id="nr-moon">
      <circle cx="250" cy="192" r="124" fill="#fff"/>
      <circle cx="304" cy="192" r="104" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#nr-bg)"/>

  <g filter="url(#nr-glow-cyan)">
    <rect width="512" height="512" fill="#00e5ff" mask="url(#nr-moon)"/>
  </g>

  <g filter="url(#nr-glow-amber)" transform="translate(318 192)">
    <path d="M 0 -50 C 20 -22, 48 -10, 48 12 C 48 32, 30 42, 15 35 C 12 34, 10 33, 8 31
             C 9 40, 13 48, 20 54 L -20 54 C -13 48, -9 40, -8 31 C -10 33, -12 34, -15 35
             C -30 42, -48 32, -48 12 C -48 -10, -20 -22, 0 -50 Z" fill="#ffab00"/>
  </g>

  <g filter="url(#nr-glow-cyan)">
    <path d="M 68 412 C 156 376, 234 446, 302 412 S 420 376, 446 412"
          fill="none" stroke="url(#nr-river)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <g filter="url(#nr-glow-amber)">
    <circle cx="182" cy="424" r="7" fill="#ffab00"/>
    <circle cx="326" cy="424" r="7" fill="#ffab00"/>
  </g>
</svg>
